# Weekly dependency updates. Minor and patch updates arrive as one pull request per ecosystem;
# majors arrive one by one. The workflows pin actions to commit SHAs, which Dependabot keeps current.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/console"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*", "@fastify/otel"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/console"]
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
